services:
  - type: web
    name: profitnx-crm
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
    # IMPORTANT: Set GOOGLE_SERVICE_ACCOUNT_JSON in Render as a Secret Environment
    # Variable containing the COMPLETE fresh service-account JSON. This takes priority
    # over any credential file bundled in the application and prevents an old/deleted
    # service-account key from being used accidentally.
    #
    # Alternative: mount a fresh google-service-account.json as a Render Secret File.
