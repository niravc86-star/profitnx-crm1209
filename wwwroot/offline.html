<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1330" />
  <title>Offline · ProfitNx CRM</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1c1440, #0b1330 55%, #070b1c);
      color: #f3ecff; padding: 24px;
    }
    .card {
      width: min(420px, 100%); background: rgba(24,18,53,.92);
      border: 1px solid rgba(202,161,74,.28); border-radius: 20px;
      padding: 28px 24px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 14px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 18px; color: #b7aed9; line-height: 1.5; font-size: .95rem; }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700;
      background: linear-gradient(135deg, #caa14a, #e8c778); color: #181235; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="ProfitNx CRM" />
    <h1>You are offline</h1>
    <p>ProfitNx CRM needs internet for live data. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
